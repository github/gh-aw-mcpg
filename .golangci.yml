version: "2"
run:
  go: "1.26.10"
  tests: true
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - misspell
    - testifylint
    - unconvert
    # gosec disabled in golangci-lint due to configuration complexity
    # Can be enabled separately with: gosec -exclude=G101,G104,G115,G301,G302,G304,G306 ./...
  disable:
    - errcheck
    - gocritic
    - revive
    - gosec
  # Configuration for disabled linters is kept for reference if they are re-enabled
  settings:
    testifylint:
      enable-all: true
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - (*os.File).Sync
        - os.Chdir
        - os.Chmod
        - os.Chtimes
        - os.MkdirAll
        - os.Remove
        - os.RemoveAll
        - os.WriteFile
    gocritic:
      enable-all: true
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
        - appendAssign
        - unlambda
        - elseif
        - assignOp
        - argOrder
        - dupBranchBody
        - deprecatedComment
        - commentFormatting
        - badCall
  exclusions:
    generated: lax
