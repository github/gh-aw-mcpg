name: Rebuild smoke-copilot workflow

on:
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 9:00 AM UTC to keep the workflow up to date
    - cron: '0 9 * * 1'
  push:
    paths:
      - '.github/workflows/smoke-copilot.md'
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-aw-mcpg repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version: '1.26.10'
          cache: false

      - name: Compile and normalize smoke-copilot workflow
        run: make compile-workflows WORKFLOW=smoke-copilot

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet .github/workflows/smoke-copilot.lock.yml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected in smoke-copilot.lock.yml"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in smoke-copilot.lock.yml"
          fi

      - name: Create Pull Request
        if: steps.check_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: rebuild smoke-copilot workflow with pinned gh-aw compiler'
          branch: automated/rebuild-smoke-copilot
          delete-branch: true
          title: 'chore: Rebuild smoke-copilot workflow'
          body: |
            ## Automated Workflow Rebuild
            
            This PR updates the `smoke-copilot.lock.yml` file by recompiling it from `smoke-copilot.md` using the pinned gh-aw compiler and repository normalizer.
            
            ### Changes
            - Built gh-aw from the immutable runtime source pin
            - Recompiled and normalized `.github/workflows/smoke-copilot.md`
            - Updated `.github/workflows/smoke-copilot.lock.yml` with the generated compilation
            
            ### Verification
            - The gh-aw-mcpg container reference should be present in the compiled workflow
            - MCP Gateway configuration should be properly set up
            
            This is an automated PR created by the rebuild-smoke-copilot workflow.
          labels: |
            automated
            workflow-maintenance

      - name: Summary
        run: |
          if [ "${{ steps.check_changes.outputs.changed }}" == "true" ]; then
            echo "✅ Created PR with updated smoke-copilot.lock.yml" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No changes needed - workflow is up to date" >> $GITHUB_STEP_SUMMARY
          fi
